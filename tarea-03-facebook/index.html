<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook - Iniciar sesión</title>
    <link rel="stylesheet" href="src/style.css" />
</head>
<body>
    <main class="container">
        <section class="left">
        <h1>facebook</h1>
        <p>Facebook te ayuda a comunicarte y compartir con las personas que forman parte de tu vida.</p>
        </section>

        <section class="right">
            <form class="login-form">
                <div class="form-group">
                <label for="email">Correo electrónico o número de teléfono</label>
                <input type="text" id="email" name="email" required />
                </div>

                <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required />
                </div>

                <button type="submit" class="login-button">Iniciar sesión</button>

                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

                <hr />

                <button type="button" class="create-account-button">Crear cuenta nueva</button>
            </form>
        </section>

    </main>
</body>
</html>
